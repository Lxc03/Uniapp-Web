server {
    listen 80;
    root /usr/share/nginx/html;

    # 通过 Compose DNS 更新 API 地址，保留浏览器请求中的 /api 前缀。
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/api(?:/|$) {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
