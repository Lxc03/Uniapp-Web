services:
  frontend:
    ports: !override
      - "127.0.0.1:5174:80"

  api:
    ports: !override
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/${LOCAL_MYSQL_DATABASE:?Set LOCAL_MYSQL_DATABASE in .env.local-mysql}"
      SPRING_DATASOURCE_USERNAME: "${LOCAL_MYSQL_USERNAME:?Set LOCAL_MYSQL_USERNAME in .env.local-mysql}"
      SPRING_DATASOURCE_PASSWORD: "${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD in .env.local-mysql}"
      AUTH_PUBLIC_ORIGIN: "http://127.0.0.1:5174"
      AUTH_COOKIE_SECURE: "false"
    depends_on: !override
      redis:
        condition: service_healthy

  mysql:
    profiles: [managed-mysql]
